name: A number looks wrong
description: A bust probability, observation, forecast or metric that does not look right.
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Every value Sanket shows should trace back to a real GRIB2 message or a real
        observation file, so a number that looks wrong is worth a report. These fields are
        what we need to find the exact row.
  - type: input
    id: district
    attributes:
      label: District (and state)
      placeholder: "Idukki, Kerala"
    validations:
      required: true
  - type: dropdown
    id: variable
    attributes:
      label: Variable
      options:
        - Rainfall
        - Temperature
        - Humidity
        - Wind speed
        - Wind direction
        - Pressure
        - Soil moisture
        - Atmospheric moisture
        - The overall bust probability
        - A model metric
    validations:
      required: true
  - type: input
    id: cycle
    attributes:
      label: Forecast cycle and lead day
      description: The issue date shown at the top of the site, and the day you were looking at.
      placeholder: "Issued 29 Sep 2026, Day 3"
    validations:
      required: true
  - type: textarea
    id: seen
    attributes:
      label: What the site shows, and what you expected
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Where your expected value comes from, for example an IMD bulletin, a station observation or another dataset, with a link if you have one.
